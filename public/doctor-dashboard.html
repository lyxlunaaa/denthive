<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard • DentHive</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Doctor Dashboard (scaffold)</h1>
      <p class="muted">Real-time queue + consultation workflow will be implemented next.</p>

      <div class="grid stats">
        <div class="stat"><div class="num" id="totalPatients">—</div><div class="lbl">Total patients</div></div>
        <div class="stat"><div class="num" id="waitingCount">—</div><div class="lbl">Patients waiting</div></div>
        <div class="stat"><div class="num" id="inProgressCount">—</div><div class="lbl">In progress</div></div>
      </div>

      <h2 style="margin-top:18px">Live Queue</h2>
      <pre id="queueView" style="white-space:pre-wrap; background:#f8fafc; border:1px solid var(--border); padding:14px; border-radius:12px; color:#0f172a;">Loading...</pre>

      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </div>
  </main>

  <script src="/js/doctor-dashboard.js"></script>

  <style>
    .auth-wrap{ padding:28px 18px; max-width:1050px; margin:0 auto; }
  </style>
</body>
</html>
