<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Portal • DentHive</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Patient Portal (scaffold)</h1>
      <p class="muted">Live queue status with ETA will be implemented next.</p>

      <div class="grid stats">
        <div class="stat"><div class="num" id="eta">—</div><div class="lbl">Estimated waiting time</div></div>
        <div class="stat"><div class="num" id="myStatus">—</div><div class="lbl">Current status</div></div>
        <div class="stat"><div class="num" id="queueNum">—</div><div class="lbl">Queue number</div></div>
      </div>

      <pre id="queueView" style="white-space:pre-wrap; background:#f8fafc; border:1px solid var(--border); padding:14px; border-radius:12px; color:#0f172a;">Loading...</pre>

      <button class="btn" id="refreshBtn" type="button">Refresh</button>
    </div>
  </main>

  <script src="/js/patient-portal.js"></script>

  <style>
    .auth-wrap{ padding:28px 18px; max-width:1050px; margin:0 auto; }
  </style>
</body>
</html>
